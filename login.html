<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · SIPEDES</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a3327, #1b6b52);
        padding: 20px;
      }

      .login-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 40px 36px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-logo {
        text-align: center;
        margin-bottom: 28px;
      }

      .login-logo img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        margin-bottom: 8px;
      }

      .login-logo h1 {
        font-size: 26px;
        font-weight: 800;
        color: #0a3327;
      }

      .login-logo h1 span {
        color: #c9956b;
      }

      .login-logo p {
        font-size: 13px;
        color: #8a9a9f;
        margin-top: 2px;
      }

      .login-error {
        background: #ffebee;
        color: #c62828;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
        border-left: 4px solid #c62828;
      }

      .login-error.show {
        display: block;
      }

      .form-group {
        margin-bottom: 16px;
        position: relative;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #1e2a2f;
        margin-bottom: 4px;
      }

      .form-group input {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid #e0e3d8;
        border-radius: 8px;
        font-size: 14px;
        font-family: "Inter", sans-serif;
        background: #f8f6f0;
        transition: 0.3s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: #0f4c3a;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(15, 76, 58, 0.08);
      }

      .password-wrapper {
        position: relative;
      }

      .password-wrapper input {
        padding-right: 44px;
      }

      .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #8a9a9f;
        font-size: 18px;
        padding: 4px;
        transition: 0.3s;
        z-index: 2;
      }

      .password-toggle:hover {
        color: #0f4c3a;
      }

      .btn-login {
        width: 100%;
        padding: 12px;
        background: #0f4c3a;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s ease;
        font-family: "Inter", sans-serif;
      }

      .btn-login:hover {
        background: #1b6b52;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(15, 76, 58, 0.25);
      }

      .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .login-footer {
        text-align: center;
        margin-top: 16px;
        font-size: 13px;
        color: #8a9a9f;
      }

      .login-footer a {
        color: #0f4c3a;
        font-weight: 600;
        text-decoration: none;
        transition: 0.3s;
      }

      .login-footer a:hover {
        color: #1b6b52;
        text-decoration: underline;
      }

      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 28px 20px;
        }
        .login-logo h1 {
          font-size: 22px;
        }
        .login-logo img {
          width: 56px;
          height: 56px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-logo">
        <img
          src="assets/images/logo.png"
          alt="SIPEDES"
          onerror="
            this.src =
              'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f4c3a%22/%3E%3Ctext x=%2250%22 y=%2265%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2248%22 font-weight=%22900%22 fill=%22%23c9956b%22%3ES%3C/text%3E%3C/svg%3E'
          "
        />
        <h1>SIPEDES</h1>
        <p>Sistem Informasi Potensi Desa</p>
      </div>

      <div class="login-error" id="loginError">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMessage">Username atau password salah!</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            value="admin"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              value="admin123"
            />
            <button type="button" class="password-toggle" id="togglePassword">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-arrow-right-to-bracket"></i> Login
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html"
          ><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a
        >
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var user = isLoggedIn();
        if (user) {
          redirectByRole(user.role);
          return;
        }

        // Toggle Password
        var toggleBtn = document.getElementById("togglePassword");
        var passwordInput = document.getElementById("password");
        var eyeIcon = document.getElementById("eyeIcon");

        toggleBtn.addEventListener("click", function () {
          var type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);
          eyeIcon.className =
            type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
        });

        var form = document.getElementById("loginForm");
        var btn = document.getElementById("loginBtn");
        var error = document.getElementById("loginError");
        var errorMsg = document.getElementById("errorMessage");

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var username = document.getElementById("username").value.trim();
          var password = document.getElementById("password").value.trim();

          if (!username || !password) {
            errorMsg.textContent = "Username dan password harus diisi!";
            error.classList.add("show");
            return;
          }

          error.classList.remove("show");
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span> Memproses...';

          setTimeout(function () {
            var result = login(username, password);
            if (result.success) {
              btn.innerHTML = '<i class="fas fa-check"></i> Berhasil!';
              btn.style.background = "#2e7d32";
              setTimeout(function () {
                redirectByRole(result.user.role);
              }, 600);
            } else {
              errorMsg.textContent = result.message;
              error.classList.add("show");
              btn.disabled = false;
              btn.innerHTML =
                '<i class="fas fa-arrow-right-to-bracket"></i> Login';
              btn.style.background = "#0f4c3a";
            }
          }, 500);
        });
      });
    </script>
  </body>
</html>
